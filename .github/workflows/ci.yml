name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore DividendGuardian.sln
      - run: dotnet restore tests/DividendGuardian.Quant.Tests/DividendGuardian.Quant.Tests.csproj
      - run: dotnet build DividendGuardian.sln --configuration Release --no-restore
      - run: dotnet test DividendGuardian.sln --configuration Release --no-build